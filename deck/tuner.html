<title>대시보드 레이아웃 조절기</title>
<style>
:root { --ink:#3d3e42; --mid:#6e7075; --soft:#9a9ca2; --rule:#c2c4ca;
        --blue:#6b84f5; --deep:#4a63d8; --panel:#ffffff; }
* { box-sizing:border-box; }
body { margin:0; background:#eceef2; color:var(--ink);
       font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
       display:grid; grid-template-columns: 1fr 300px; height:100vh; }
#stage { position:relative; overflow:hidden; }
iframe { width:100%; height:100%; border:0; background:#fff; display:block; }

/* 좌우 비율 손잡이 — 카드 가운데를 끌어 옮긴다 */
#grip { position:absolute; top:0; bottom:0; width:14px; cursor:col-resize;
        z-index:5; display:flex; align-items:center; justify-content:center; }
#grip::before { content:""; width:3px; height:64px; border-radius:2px;
                background:var(--blue); opacity:.55; }
#grip:hover::before, #grip.on::before { opacity:1; }
#griplab { position:absolute; top:12px; left:50%; transform:translateX(-50%);
           background:var(--deep); color:#fff; font-size:11px; padding:3px 9px;
           border-radius:3px; white-space:nowrap; z-index:6; }

aside { background:var(--panel); border-left:1px solid var(--rule);
        display:flex; flex-direction:column; min-height:0; }
aside h1 { margin:0; padding:14px 16px; font-size:15px;
           border-bottom:1px solid var(--rule); }
aside h1 small { display:block; font-weight:400; font-size:11.5px;
                 color:var(--soft); margin-top:3px; line-height:1.5; }
#knobs { flex:1; overflow-y:auto; padding:8px 16px 16px; }
.k { padding:9px 0; border-bottom:1px solid #eef0f3; }
.k .t { display:flex; justify-content:space-between; align-items:baseline;
        font-size:12.5px; margin-bottom:5px; }
.k .t b { font-weight:600; }
.k .t output { font-variant-numeric:tabular-nums; color:var(--deep);
               font-weight:600; }
.k input[type=range] { width:100%; accent-color:var(--blue); }
.k .sel { font-size:10.5px; color:var(--soft); font-family:Consolas,monospace; }
footer { border-top:1px solid var(--rule); padding:12px 16px;
         display:flex; flex-direction:column; gap:8px; }
#outbox { width:100%; height:120px; resize:vertical; font-size:11.5px;
          line-height:1.6; font-family:Consolas,monospace; color:#2f3136;
          background:#f6f7f9; border:1px solid var(--rule); padding:8px;
          white-space:pre; overflow:auto; }
#outbox:focus { outline:2px solid var(--blue); outline-offset:-1px; }
button { font:inherit; font-size:13px; padding:8px 14px; cursor:pointer;
         border:1px solid var(--rule); background:#fff; }
button.go { background:var(--blue); border-color:var(--blue); color:#fff; }
button.go:hover { background:var(--deep); }
button:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
#msg { font-size:11.5px; color:#2f8f5b; min-height:1.2em; }
</style>

<div id="stage">
  <iframe id="v" title="대시보드 미리보기"></iframe>
  <div id="grip" hidden><span id="griplab" hidden></span></div>
</div>

<aside>
  <h1>레이아웃 조절기
    <small>막대를 움직이면 왼쪽 화면이 바로 바뀝니다.
      좌우 칸 비율은 화면 가운데 <b>파란 손잡이를 끌어서</b> 맞추세요.
      값은 아래 상자에 바로 쌓입니다. 그대로 채팅에 붙여 주세요.</small></h1>
  <div id="knobs"></div>
  <footer>
    <textarea id="outbox" readonly spellcheck="false"
              aria-label="맞춘 값"></textarea>
    <div style="display:flex;gap:8px">
      <button class="go" id="copy" style="flex:1">전체 선택 + 복사</button>
      <button id="reset">처음으로</button>
    </div>
    <div id="msg"></div>
  </footer>
</aside>

/* Hallmark · tokens · theme: Pastel(차용) · genre: modern-minimal
 * paper-band: light · display-style: system-sans + Geist Mono figures
 * accent-hue: cool-indigo 268° · semantic: 상승 27° / 하락 268°
 *
 * 🔴 **라이트 전용으로 확정한다.** 다크 모드를 함께 만들었더니 뷰어 테마에서
 *    중요한 글자가 배경에 묻혔다. 이 산출물은 매일 아침 3초 안에 읽는
 *    업무 문서라 가시성이 취향보다 우선한다. 그래서 뷰어가 다크를 요청해도
 *    라이트를 유지한다 — 누락이 아니라 결정이다.
 *
 * 종이·잉크·액센트 값은 usehallmark.com/examples/tally 의 토큰을 그대로 쓴다.
 * 258° 축 위에 4단 종이 + 4단 잉크, 268° 인디고 액센트.
 */
:root, :root[data-theme="dark"], :root[data-theme="light"] {
  color-scheme: light;

  /* ── Tally 토큰 그대로 ── */
  --color-paper-0: oklch(98.4% 0.005 258);
  --color-paper-1: oklch(96.2% 0.010 258);
  --color-paper-2: oklch(93.0% 0.015 258);
  --color-paper-3: oklch(89.0% 0.020 258);
  --color-ink-0:   oklch(18.0% 0.030 258);
  --color-ink-1:   oklch(35.0% 0.025 258);
  --color-ink-2:   oklch(52.0% 0.018 258);
  --color-ink-3:   oklch(70.0% 0.012 258);

  --color-accent:      oklch(54.0% 0.220 268);
  --color-accent-soft: oklch(72.0% 0.140 268);
  --color-accent-tint: oklch(94.0% 0.040 268);
  --color-companion:   oklch(82.0% 0.180 130);
  --color-warning:     oklch(74.0% 0.180 50);
  --color-success:     oklch(68.0% 0.150 145);
  --color-focus:       oklch(46.0% 0.220 268);

  /* ── 🔴 증감의 적·청 배색을 걷어냈다.
       색이 많아지자 「무엇이 중요한가」가 아니라 「무슨 색인가」를 먼저
       읽게 됐다. 방향은 부호(+/−)가 이미 말한다. 그래서 판정 3색을
       전부 배경과 같은 연두 계열로 눕히고, 위계는 굵기·자리로만 만든다.
       나중에 필요해지면 이 한 곳만 되돌리면 된다 ── */
  /* 면은 전부 흰 톤이다. 연두는 **그래프 아래 그라데이션 한 곳**에만 남긴다 —
     색이 한 군데만 있으면 그 한 군데가 곧 시선의 목적지가 된다 */
  --color-leaf:      var(--color-card);
  --color-leaf-2:    var(--color-paper-1);
  --color-leaf-line: color-mix(in oklch, var(--color-ink-0) 11%, transparent);
  --color-card:      oklch(100% 0 0);
  /* 🔴 증감 색을 되살린다 — 전에 걷어냈던 이유(색이 많아 「무엇이 중요한가」
     보다 「무슨 색인가」를 먼저 읽게 됨)는 **채도로 해결한다.** 신호등처럼
     쨍한 적·청이 아니라 잉크에 가까운 낮은 채도로 둔다. 방향은 부호가
     이미 말하고, 색은 그것을 거들 뿐이다. */
  --color-up:        oklch(52.0% 0.150 25);    /* 오름 — 낮은 채도의 붉은 잉크 */
  --color-up-soft:   oklch(96.5% 0.020 25);
  --color-down:      oklch(52.0% 0.115 250);   /* 내림 — 낮은 채도의 푸른 잉크 */
  --color-down-soft: oklch(96.5% 0.016 250);
  --color-flat:      oklch(52.0% 0.018 258);
  /* 강조 요소(넘김 버튼·점·선택)는 증감 색을 쓰지 않는다 — 방향을 뜻하지
     않는 자리에 방향 색이 있으면 그것도 신호로 읽힌다 */
  --color-mark:      oklch(30.0% 0.020 258);

  /* 🔴 한글은 OS 기본 산세로 통일한다.
   *
   *    이전 스택 맨 앞에 Pretendard 를 뒀는데 그것은 시스템 폰트가 아니다.
   *    설치된 기기에서만 적용되므로 심사자 화면과 내 화면이 달라진다.
   *    깨지지는 않지만 **같게 나온다는 보장이 없다.**
   *
   *    그래서 각 OS 의 기본 산세만 남기고 마지막을 generic `sans-serif` 로 닫는다.
   *    Windows 맑은 고딕 · macOS 애플 SD 산돌고딕 · Linux Noto Sans KR.
   *    자형은 조금씩 다르지만 **어느 환경에서도 산세로 렌더링된다.**
   *
   *    숫자만 Geist Mono 를 본문에 심어 어디서나 똑같이 나오게 했다 —
   *    이 산출물에서 환경에 따라 달라지면 안 되는 것은 숫자다.
   */
  --font-body: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR",
               system-ui, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Consolas, monospace;

  /* 🔴 **자형 대신 크기로 다듬는다.**
   *
   *    한글 웹폰트를 심어 어디서나 같은 자형을 내는 길은 막혀 있다 —
   *    화면에 나올 수 있는 글자만 추려도 106KB(본문 삽입 142KB)이고,
   *    타임리 create_artifact 한도가 200KB, 본문이 이미 48KB 다.
   *    (실측: 한글 전체 2,341KB · 상용 2,350자 460KB)
   *
   *    맑은 고딕은 **클수록 거칠어 보인다** — 힌팅이 작은 크기에 맞춰져
   *    있어서다. 그래서 본문을 한 단 내리고 자간을 살짝 조인다.
   *    위계는 크기 차이가 아니라 **굵기와 자리**가 이미 만들고 있다.
   *
   *    품목을 넓힌 뒤 용량이 허락하면 그때 자형을 심는다. */
  --text-xs:   0.6875rem;   /* 12 → 11 */
  --text-sm:   0.8125rem;   /* 14 → 13 */
  --text-base: 0.9375rem;   /* 16 → 15 */
  --text-md:   1rem;        /* 17 → 16 */
  --text-lg:   1.125rem;    /* 20 → 18 */
  --text-xl:   1.4375rem;   /* 26 → 23 */
  --text-2xl:  2rem;        /* 36 → 32 */
  --text-hero: clamp(2.75rem, 10vw, 4.75rem);
  /* 한글은 자간이 조금 좁아야 덩어리로 읽힌다 */
  --track-ko: -0.008em;

  --space-2xs: 0.25rem; --space-xs: 0.5rem;  --space-sm: 0.75rem;
  --space-md:  1rem;    --space-lg: 1.5rem;  --space-xl: 2rem;
  --space-2xl: 3rem;    --space-3xl: 4.5rem;

  /* 각진 형태로 간다 — 표는 모서리를 굴리지 않는다 */
  --radius-sm: 0;   --radius-md: 0;
  --radius-lg: 0;   --radius-pill: 999px;

  --rule-hair: 1px solid color-mix(in oklch, var(--color-ink-0) 8%, transparent);
  --rule-soft: 1px solid color-mix(in oklch, var(--color-ink-0) 14%, transparent);
  --rule-firm: 1px solid color-mix(in oklch, var(--color-ink-0) 28%, transparent);

  --shadow-card: 0 1px 0 rgba(255, 255, 255, 0.6) inset,
                 0 10px 30px -18px rgba(20, 30, 80, 0.22);
  --shadow-pill: 0 1px 0 rgba(255, 255, 255, 0.6) inset,
                 0 8px 30px -12px rgba(20, 30, 80, 0.18);

  --ease-out:    cubic-bezier(0.22, 0.61, 0.36, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-fast: 140ms;
  --dur-mid:  240ms;
}


  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overflow-x: clip; }
  html {
    font-family: var(--font-body);
    color: var(--color-ink-0);
    background: var(--color-paper-0);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  /* 단색 바탕이 아니라 두 겹의 광원. 스크롤해도 고정된다 */
  body {
    font-size: var(--text-base); line-height: 1.6;
    letter-spacing: var(--track-ko);
    background:
      radial-gradient(1100px 560px at 14% -8%,
        color-mix(in oklch, var(--color-accent-tint) 75%, transparent), transparent 62%),
      radial-gradient(820px 460px at 88% 6%,
        color-mix(in oklch, var(--color-companion) 55%, transparent), transparent 58%),
      var(--color-paper-0);
    background-attachment: fixed;
    padding: 0 var(--space-md) var(--space-3xl);
  }
  ::selection { background: var(--color-mark); color: var(--color-paper-0); }
  :focus-visible { outline: 2px solid var(--color-focus); outline-offset: 3px;
                   border-radius: var(--radius-sm); }
  .fig { font-family: var(--font-mono); font-variant-numeric: tabular-nums;
         letter-spacing: -0.02em; }
  .eyebrow { font-family: var(--font-mono); font-size: var(--text-xs);
             letter-spacing: 0.1em; text-transform: uppercase;
             color: var(--color-ink-2); }

  .sheet { width: 100%; max-width: 68rem; margin: 0 auto;
           display: flex; flex-direction: column; gap: var(--space-2xl); }

  /* ── 머리. 모눈을 깔고 가운데만 남기고 지운다 ── */
  .top { position: relative; padding: var(--space-3xl) 0 var(--space-xl);
         overflow: clip; display: flex; flex-direction: column;
         gap: var(--space-md); }
  .top::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(to right,
        color-mix(in oklch, var(--color-ink-0) 7%, transparent) 1px, transparent 1px),
      linear-gradient(to bottom,
        color-mix(in oklch, var(--color-ink-0) 7%, transparent) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 78% 66% at 34% 38%, black 26%, transparent 72%);
    -webkit-mask-image: radial-gradient(ellipse 78% 66% at 34% 38%, black 26%, transparent 72%);
  }
  .top > * { position: relative; }

  .status { align-self: flex-start; display: inline-flex; align-items: center;
            flex-wrap: wrap; gap: var(--space-2xs) var(--space-xs);
            padding: 7px 16px 7px 12px;
            border: var(--rule-soft); border-radius: var(--radius-pill);
            background: color-mix(in oklch, var(--color-paper-0) 74%, transparent);
            -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
            box-shadow: var(--shadow-pill);
            font-family: var(--font-mono); font-size: var(--text-xs);
            letter-spacing: 0.04em; color: var(--color-ink-1); }
  .status .brand { color: var(--color-ink-0); letter-spacing: .02em; }
  .status .sep { color: var(--color-ink-3); }
  .status .dot { width: 7px; height: 7px; border-radius: var(--radius-pill);
                 background: var(--color-success); flex: none;
                 animation: live 2000ms var(--ease-in-out) infinite; }
  @keyframes live {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in oklch, var(--color-success) 55%, transparent); }
    55%      { box-shadow: 0 0 0 6px color-mix(in oklch, var(--color-success) 0%, transparent); }
  }

  .hero-num { font-size: var(--text-hero); line-height: 0.9; font-weight: 600;
              letter-spacing: -0.055em; overflow-wrap: anywhere; min-width: 0; }
  .hero-num.up   { color: var(--color-up); }
  .hero-num.calm { color: var(--color-ink-0); }
  .hero-num .unit { font-size: 0.34em; letter-spacing: -0.01em;
                    color: var(--color-ink-2); margin-left: 0.12em; }
  .hero-say { font-size: var(--text-xl); line-height: 1.42; margin: 0;
              letter-spacing: -0.018em; color: var(--color-ink-1); }
  .hero-say strong { font-weight: inherit; color: var(--color-ink-0); }

  /* ── 용어. 한 번만 정의하고 접어둔다 ── */
  .legend { border: 1px solid var(--color-leaf-line);
            background: var(--color-leaf);
            -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  /* 🔴 `.eyebrow` 를 재정의해 쓰지 않는다. 그 클래스는 mono 를 물고 있어서,
     한 군데라도 규칙이 어긋나면 조용히 mono 로 떨어진다. **아예 다른
     클래스**를 쓰고 자형을 직접 적는다 — 상속 사고가 구조적으로 불가능해진다. */
  .legend > summary .ttl {
    font: inherit;                       /* 본문과 완전히 같게 — 굵기도 상속 */
    font-size: var(--text-md); color: var(--color-ink-0); }
  .legend > summary { cursor: pointer; list-style: none;
                      padding: var(--space-md) var(--space-lg);
                      display: flex; align-items: center; gap: var(--space-xs); }
  .legend > summary::-webkit-details-marker { display: none; }
  .legend > summary::after { content: "＋"; margin-left: auto;
                             color: var(--color-ink-2); font-size: var(--text-sm); }
  .legend[open] > summary::after { content: "－"; }
  .legend > summary:hover { color: var(--color-accent); }
  .legend .body { padding: 0 var(--space-lg) var(--space-lg);
                  border-top: var(--rule-hair); padding-top: var(--space-md); }
  .legend dl { margin: 0; display: grid; gap: var(--space-sm) var(--space-lg);
               grid-template-columns: max-content minmax(0, 1fr); }
  .legend dt { font-weight: 600; font-size: var(--text-sm); white-space: nowrap; }
  .legend dd { margin: 0; font-size: var(--text-sm); color: var(--color-ink-2);
               line-height: 1.6; }
  .legend dd b { color: var(--color-ink-0); font-weight: 500; }
  .legend .more { margin-top: var(--space-lg); padding-top: var(--space-md);
                  border-top: 1px solid var(--color-leaf-line);
                  display: flex; flex-direction: column; gap: var(--space-2xs);
                  font-size: var(--text-sm); color: var(--color-ink-2); }
  .legend .more h3 { margin: var(--space-sm) 0 0; font-size: var(--text-xs);
                     letter-spacing: .08em; color: var(--color-ink-1);
                     font-weight: 600; }
  .legend .more ul { margin: 0; padding-left: var(--space-md); line-height: 1.7; }

  .keys { display: flex; flex-wrap: wrap; gap: var(--space-xs) var(--space-lg);
          margin-top: var(--space-md); padding-top: var(--space-md);
          border-top: var(--rule-hair); font-size: var(--text-sm); }
  .key { display: inline-flex; align-items: center; gap: var(--space-2xs); }
  .key i { width: 0.7rem; height: 0.7rem; border-radius: 3px; display: inline-block; }
  .key.up i   { background: var(--color-up); }
  .key.down i { background: var(--color-down); }
  .key.flat i { background: var(--color-flat); }

  /* ── 항목. 한 화면에 하나씩, 좌우로 넘긴다 ── */
  .ledger { display: flex; flex-direction: column; gap: var(--space-md); }
  /* 카드를 화살표가 좌우에서 감싼다 — 넘기는 동작이 카드 옆에 있어야
     시선이 아래로 내려갔다 올라오지 않는다 */
  .deck { display: grid; grid-template-columns: 42px minmax(0, 1fr) 42px;
          align-items: center; gap: var(--space-sm);
          /* 화살표를 본문 폭 바깥으로 내보내 카드가 다른 블록과 같은 너비가 되게 한다 */
          margin-inline: calc(-1 * (42px + var(--space-sm))); }
  .viewport { overflow: hidden; border-radius: var(--radius-lg); }
  .track { display: flex; transition: transform var(--dur-mid) var(--ease-out); }
  .track > .entry { flex: 0 0 100%; min-width: 0; }

  .pager { display: flex; align-items: center; justify-content: center;
           gap: var(--space-sm); }
  .nav { width: 42px; height: 42px; flex: none; cursor: pointer;
         border: var(--rule-soft); border-radius: var(--radius-pill);
         background: color-mix(in oklch, var(--color-paper-0) 76%, transparent);
         -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
         box-shadow: var(--shadow-pill);
         color: var(--color-ink-1); font-size: var(--text-md);
         display: grid; place-items: center;
         transition: color var(--dur-fast) var(--ease-out),
                     border-color var(--dur-fast) var(--ease-out); }
  .nav:hover { color: var(--color-accent); border-color: var(--color-accent); }
  .nav:disabled { opacity: .35; cursor: default; }
  .pips { display: flex; gap: var(--space-2xs); }
  .pip:hover { border-color: var(--color-accent); }
  .nav-m { display: none; }
  .pip { width: 7px; height: 7px; padding: 0; cursor: pointer;
         border: 0; border-radius: var(--radius-pill);
         background: var(--color-paper-3);
         transition: background var(--dur-fast) var(--ease-out); }
  .pip[aria-current="true"] { background: var(--color-mark); }
  .count { font-size: var(--text-sm); color: var(--color-ink-3); }
  .count b { font-weight: inherit; color: var(--color-ink-0); }

  /* ── 시계열 그래프 ── */
  .chart { margin: 0; display: flex; flex-direction: column; gap: var(--space-xs); }
  .chart figcaption { display: flex; align-items: baseline; flex-wrap: wrap;
                      gap: var(--space-2xs) var(--space-sm); }
  /* 🔴 두 조각이 자형이 달라 한 줄이 두 목소리로 읽혔다. 왼쪽에 맞춘다. */
  .chart figcaption .cap,
  .chart figcaption .seg { font-family: var(--font-mono); font-size: var(--text-xs);
                           letter-spacing: .06em; color: var(--color-ink-2); }
  .chart figcaption .seg { color: var(--color-ink-3); }
  /* 🔴 순위 막대 — 값을 큰 순서로 늘어놓는다.
     꺾은선은 「이렇게 흘러왔다」는 추세로 읽히는데 우리는 추세를 주장하지
     않는다. 우리가 말하는 것은 「6년 중 몇 번째」 하나뿐이므로 그림도
     그것만 그린다. */
  .chart .bars { display: flex; flex-direction: column; gap: 9px; }
  .chart .bar { display: grid; grid-template-columns: 2.9rem minmax(0, 1fr) 3.6rem;
                align-items: center; gap: var(--space-xs); }
  .chart .bar .yr { font-family: var(--font-mono); font-size: var(--text-xs);
                    color: var(--color-ink-3); text-align: right; }
  .chart .bar .val { font-family: var(--font-mono); font-size: var(--text-xs);
                     color: var(--color-ink-3); text-align: right; }
  .chart .bar .track { height: 21px; background: color-mix(in oklch,
                       var(--color-ink-0) 4%, transparent); border-radius: 2px; }
  .chart .bar .fill { display: block; height: 100%; border-radius: 2px;
                      background: color-mix(in oklch, var(--color-ink-0) 13%, transparent);
                      min-width: 3px; }
  /* 올해만 칠한다 — 눈이 한 번에 찾아간다 */
  .chart .bar.now .yr,
  .chart .bar.now .val { color: var(--color-ink-0); font-weight: 600; }
  /* 🔴 막대를 액센트(파랑)로 칠하면 「감소」 색과 같아 방향으로 오독된다.
     막대는 방향이 아니라 **순위**를 말하므로 배경 계열의 연두를 쓴다. */
  .chart .bar.now .fill { background: var(--color-companion); }
  .chart .legend-line { display: flex; flex-wrap: wrap;
                        gap: var(--space-2xs) var(--space-md);
                        font-size: var(--text-xs); color: var(--color-ink-2); }
  .chart .lg { display: inline-flex; align-items: center; gap: var(--space-2xs); }
  .chart .lg.pick::before { content: ""; width: 10px; height: 10px;
                            border-radius: 2px; background: var(--color-companion); }
  .chart .lg.pick b { color: var(--color-ink-0); font-weight: 600; }
  /* 「월평균값·막대 시작점」 설명은 범례 오른쪽 여백에 붙인다 */
  .chart .lg.note { margin-left: auto; color: var(--color-ink-3); text-align: right; }
  .entry { border: 1px solid var(--color-leaf-line);
           background: var(--color-card);
           padding: var(--space-xl);
           display: grid; gap: var(--space-lg);
           grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
           grid-template-areas:
             "head head"
             "left right"
             "chain chain"
             "notes notes"; }
  .entry-head { grid-area: head; }
  .col-l { grid-area: left; display: flex; flex-direction: column;
           gap: var(--space-lg); }
  .col-r { grid-area: right; display: flex; flex-direction: column;
           gap: var(--space-lg); align-self: start; }
  .entry .chain { grid-area: chain; }
  .entry .notes { grid-area: notes; padding-top: var(--space-md);
                  border-top: 1px solid var(--color-leaf-line); }
  .entry-head { display: flex; align-items: center; gap: var(--space-sm);
                flex-wrap: wrap; padding-bottom: var(--space-sm);
                border-bottom: 1px solid var(--color-leaf-line); }
  .entry-head .rank { font-family: var(--font-mono); font-size: var(--text-xs);

<script>
/* 좌우 넘김. 스크롤이 아니라 transform 으로 옮긴다 —
   레이아웃 속성을 건드리지 않아야 프레임이 떨어지지 않는다. */
(function () {
  var track = document.querySelector(".track");
  if (!track) return;
  var total = track.children.length;
  var at = 0;
  var pips = Array.prototype.slice.call(document.querySelectorAll(".pip"));
  var prevs = Array.prototype.slice.call(document.querySelectorAll(".nav.prev"));
  var nexts = Array.prototype.slice.call(document.querySelectorAll(".nav.next"));
  var count = document.querySelector(".count b");

  function draw() {
    track.style.transform = "translateX(" + (-at * 100) + "%)";
    pips.forEach(function (b, i) {
      b.setAttribute("aria-current", i === at ? "true" : "false");
    });
    if (count) count.textContent = at + 1;
    prevs.forEach(function (b) { b.disabled = at === 0; });
    nexts.forEach(function (b) { b.disabled = at === total - 1; });
  }
  function go(i) { at = Math.max(0, Math.min(total - 1, i)); draw(); }

  prevs.concat(nexts).forEach(function (b) {
    b.addEventListener("click", function () {
      go(at + parseInt(b.dataset.step, 10));
    });
  });
  pips.forEach(function (b) {
    b.addEventListener("click", function () { go(parseInt(b.dataset.go, 10)); });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") go(at - 1);
    if (e.key === "ArrowRight") go(at + 1);
  });
  draw();
})();
<\/script>
</script>
<script>
const 손잡이 = [{"id": "cardpad", "name": "카드 안쪽 여백", "sel": ".entry", "prop": "padding", "min": 12, "max": 48, "def": 32, "unit": "px"}, {"id": "colgap", "name": "좌우 칸 사이", "sel": ".entry", "prop": "column-gap", "min": 8, "max": 64, "def": 24, "unit": "px"}, {"id": "rowgap", "name": "위아래 블록 사이", "sel": ".entry", "prop": "row-gap", "min": 8, "max": 64, "def": 24, "unit": "px"}, {"id": "headgap", "name": "라벨 ↔ 순위 문구", "sel": ".entry-head .move", "prop": "gap", "min": 0, "max": 24, "def": 8, "unit": "px"}, {"id": "itemsize", "name": "품목명 크기", "sel": ".entry-head .item", "prop": "font-size", "min": 16, "max": 40, "def": 24, "unit": "px"}, {"id": "ranksize", "name": "순위 문구 크기", "sel": ".entry-head .move .rankword", "prop": "font-size", "min": 12, "max": 32, "def": 18, "unit": "px"}, {"id": "saysize", "name": "설명 문장 크기", "sel": ".say", "prop": "font-size", "min": 12, "max": 22, "def": 16, "unit": "px"}, {"id": "barh", "name": "막대 높이", "sel": ".chart .bar .track", "prop": "height", "min": 10, "max": 40, "def": 21, "unit": "px"}, {"id": "bargap", "name": "막대 사이", "sel": ".chart .bars", "prop": "gap", "min": 2, "max": 24, "def": 9, "unit": "px"}, {"id": "rgap", "name": "그래프 ↔ 도시 비교", "sel": ".col-r", "prop": "gap", "min": 8, "max": 72, "def": 24, "unit": "px"}, {"id": "lgap", "name": "설명 ↔ 벌어진 조건", "sel": ".col-l", "prop": "gap", "min": 8, "max": 72, "def": 24, "unit": "px"}, {"id": "statpad", "name": "「벌어진 조건」 여백", "sel": ".stat", "prop": "padding", "min": 12, "max": 48, "def": 24, "unit": "px"}];

손잡이.forEach(k => 값[k.id] = k.def);

}
function 칠하기() {

  s.textContent = css();
  손잡이.forEach(k => {
    const o = document.getElementById("o_" + k.id);
    if (o) o.value = 값[k.id] + k.unit;
  });
  document.getElementById("outbox").value = 요약();
  손잡이위치();
}

// ── 좌우 비율 손잡이 ──────────────────────────────────────────
const grip = document.getElementById("grip"), lab = document.getElementById("griplab");
function 첫카드() {
  const d = v.contentDocument;
  return d && d.querySelector(".entry");
}
function 손잡이위치() {
  const e = 첫카드();
  if (!e) { grip.hidden = true; return; }
  const r = e.getBoundingClientRect();
  const pad = parseFloat(v.contentWindow.getComputedStyle(e).paddingLeft);
  const gap = parseFloat(v.contentWindow.getComputedStyle(e).columnGap);
  const 안 = r.width - pad * 2 - gap;
  const 왼 = 안 / (1 + 비율);
  grip.hidden = false; lab.hidden = false;
  grip.style.left = (r.left + pad + 왼 + gap / 2 - 7) + "px";
  lab.textContent = `좌우 1 : ${비율.toFixed(2)}`;
}
let 끄는중 = false;
grip.addEventListener("pointerdown", e => {
  끄는중 = true; grip.classList.add("on"); grip.setPointerCapture(e.pointerId);
});
window.addEventListener("pointermove", e => {
  if (!끄는중) return;
  const el = 첫카드(); if (!el) return;
  const r = el.getBoundingClientRect();
  const pad = parseFloat(v.contentWindow.getComputedStyle(el).paddingLeft);
  const gap = parseFloat(v.contentWindow.getComputedStyle(el).columnGap);
  const 안 = r.width - pad * 2 - gap;
  const 왼 = Math.min(Math.max(e.clientX - (r.left + pad), 안 * 0.25), 안 * 0.75);
  비율 = Math.round(((안 - 왼) / 왼) * 100) / 100;
  칠하기();
});
window.addEventListener("pointerup", () => { 끄는중 = false; grip.classList.remove("on"); });

손잡이.forEach(k => {
  document.getElementById("r_" + k.id).addEventListener("input", e => {

});
// 🔴 아티팩트는 샌드박스라 navigator.clipboard 가 막힐 수 있다. 막히면
//    값이 **콘솔로만** 가는데 그건 아무에게도 전달되지 않는다 —
//    실제로 「콘솔에 출력했다」는 안내만 보고 값이 사라졌다.
//    그래서 값을 **항상 화면 상자에 띄워 두고**, 복사는 거들기만 한다.
function 요약() {
  const 바뀐 = 손잡이.filter(k => 값[k.id] !== k.def)
    .map(k => `${k.name}: ${값[k.id]}${k.unit}   (${k.sel} · ${k.prop})`);

}
